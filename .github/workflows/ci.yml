# Runs only checks that need no credentials, and nothing that deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the screen
        run: npm run build:screen

      # test/screens.test.js is left out: its style fingerprints and fit checks were
      # recorded on macOS and fail on Linux because fonts render differently. Run it
      # locally with `npm test`.
      - name: Tests (all but the screen fingerprints)
        run: node --test $(find test -maxdepth 1 -name '*.test.js' ! -name screens.test.js)
