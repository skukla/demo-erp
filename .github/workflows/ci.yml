# Runs only checks that need no credentials, and nothing that deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the screen
        run: npm run build:screen

      - name: Install the headless browser for the screen tests
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm test
