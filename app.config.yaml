application:
  # No static site: the ERP shares a Runtime namespace with its integration, a
  # namespace has ONE static site, and `aio app deploy` empties it before
  # uploading. The screen is served by the `screen` action instead, built from
  # screen/ by the hook below.
  #
  # `aio` decides an app has a front end by whether its web folder EXISTS, and
  # the default folder is web-src/. A copy of this repo cloned before the move
  # can still hold an ignored web-src/src/config.json after pulling, which would
  # quietly turn the front end back on. Naming a folder that never exists rules
  # that out.
  web: no-static-site
  hooks:
    pre-app-build: node scripts/build-screen.js
  runtimeManifest:
    database:
      auto-provision: true
      region: amer
    packages:
      demo-erp:
        license: Apache-2.0
        # Every action that can raise an event takes where to deliver it and the credential
        # to sign it with (EVENTS_WEBHOOK_URL, EVENTS_AUTH_*). Both are unset for an ERP
        # sharing its integration's workspace, which delivers to the ingestion action in its
        # own namespace with its own credential; Demo Builder sets them for an ERP in a
        # workspace of its own (lib/events.js).
        # Undelivered ERP events are retried every minute (a real ERP's outbound queue).
        triggers:
          events-retry-timer:
            feed: /whisk.system/alarms/interval
            inputs:
              minutes: 1
        rules:
          events-retry-on-timer:
            trigger: events-retry-timer
            action: events-retry
        actions:
          events-retry:
            function: actions/events/retry.js
            web: 'no'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
              ERP_ID: $ERP_ID
              EVENTS_WEBHOOK_URL: $EVENTS_WEBHOOK_URL
              EVENTS_AUTH_CLIENT_ID: $EVENTS_AUTH_CLIENT_ID
              EVENTS_AUTH_CLIENT_SECRET: $EVENTS_AUTH_CLIENT_SECRET
              EVENTS_AUTH_ORG_ID: $EVENTS_AUTH_ORG_ID
              EVENTS_AUTH_SCOPES: $EVENTS_AUTH_SCOPES
            annotations:
              include-ims-credentials: true
              final: true
          health:
            function: actions/health/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
              ERP_ID: $ERP_ID
              EVENTS_WEBHOOK_URL: $EVENTS_WEBHOOK_URL
              EVENTS_AUTH_CLIENT_ID: $EVENTS_AUTH_CLIENT_ID
              EVENTS_AUTH_CLIENT_SECRET: $EVENTS_AUTH_CLIENT_SECRET
              EVENTS_AUTH_ORG_ID: $EVENTS_AUTH_ORG_ID
              EVENTS_AUTH_SCOPES: $EVENTS_AUTH_SCOPES
            annotations:
              require-adobe-auth: true
              include-ims-credentials: true
              final: true
          search:
            function: actions/search/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
              ERP_ID: $ERP_ID
              EVENTS_WEBHOOK_URL: $EVENTS_WEBHOOK_URL
              EVENTS_AUTH_CLIENT_ID: $EVENTS_AUTH_CLIENT_ID
              EVENTS_AUTH_CLIENT_SECRET: $EVENTS_AUTH_CLIENT_SECRET
              EVENTS_AUTH_ORG_ID: $EVENTS_AUTH_ORG_ID
              EVENTS_AUTH_SCOPES: $EVENTS_AUTH_SCOPES
            annotations:
              require-adobe-auth: true
              include-ims-credentials: true
              final: true
          settings:
            function: actions/settings/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
              ERP_ID: $ERP_ID
              EVENTS_WEBHOOK_URL: $EVENTS_WEBHOOK_URL
              EVENTS_AUTH_CLIENT_ID: $EVENTS_AUTH_CLIENT_ID
              EVENTS_AUTH_CLIENT_SECRET: $EVENTS_AUTH_CLIENT_SECRET
