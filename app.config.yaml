application:
  # No `web:` and no web-src/ folder: the ERP shares a Runtime namespace with its
  # integration, a namespace has ONE static site, and `aio app deploy` empties it
  # before uploading. The screen is served by the `screen` action instead, built
  # from screen/ by this hook.
  hooks:
    pre-app-build: node scripts/build-screen.js
  runtimeManifest:
    database:
      auto-provision: true
      region: amer
    packages:
      demo-erp:
        license: Apache-2.0
        # Undelivered ERP events are retried every minute (a real ERP's outbound queue).
        triggers:
          events-retry-timer:
            feed: /whisk.system/alarms/interval
            inputs:
              minutes: 1
        rules:
          events-retry-on-timer:
            trigger: events-retry-timer
            action: events-retry
        actions:
          events-retry:
            function: actions/events/retry.js
            web: 'no'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
            annotations:
              include-ims-credentials: true
              final: true
          health:
            function: actions/health/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
            annotations:
              require-adobe-auth: true
              include-ims-credentials: true
              final: true
          settings:
            function: actions/settings/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
            annotations:
              require-adobe-auth: true
              include-ims-credentials: true
              final: true
          admin:
            function: actions/admin/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 120000
              memorySize: 512
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
            annotations:
              require-adobe-auth: true
              include-ims-credentials: true
              final: true
          products:
            function: actions/products/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
            annotations:
              require-adobe-auth: true
              include-ims-credentials: true
              final: true
          partners:
            function: actions/partners/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
            annotations:
              require-adobe-auth: true
              include-ims-credentials: true
              final: true
          pricing:
            function: actions/pricing/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 30000
              concurrency: 200
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
            annotations:
              require-adobe-auth: true
              include-ims-credentials: true
              final: true
          orders:
            function: actions/orders/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
            annotations:
              require-adobe-auth: true
              include-ims-credentials: true
              final: true
          # The screen and its data calls. No Adobe sign-in: the key Demo Builder puts in
          # the link it opens is this action's access control (lib/screen.js).
          screen:
            function: actions/screen/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 120000
              memorySize: 512
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
              ERP_SCREEN_KEY: $ERP_SCREEN_KEY
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
          events:
            function: actions/events/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: info
              ERP_DISPLAY_NAME: $ERP_DISPLAY_NAME
            annotations:
              require-adobe-auth: true
              include-ims-credentials: true
              final: true
